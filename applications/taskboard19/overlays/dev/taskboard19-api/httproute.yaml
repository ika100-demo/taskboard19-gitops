apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard19-api
  labels:
    app: taskboard19-api
    app.kubernetes.io/name: taskboard19-api
    app.kubernetes.io/part-of: taskboard19
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard19-api.taskboard19-dev.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard19-api
      port: 80
